repos:
  - repo: local
    hooks:
    - id: mypy
      name: Run mypy
      language: system
      entry: poetry poe mypy
      always_run: true
      pass_filenames: false
      stages: [pre-commit, pre-push]
    - id: pylint
      name: Run pylint
      language: system
      entry: poetry poe pylint
      always_run: true
      pass_filenames: false
      stages: [pre-commit, pre-push]
    - id: black
      name: Run black
      language: system
      entry: poetry poe black
      always_run: true
      pass_filenames: false
      stages: [pre-commit, pre-push]
    - id: unit_tests
      name: Run unit tests
      language: system
      entry: poetry poe unit_tests
      always_run: true
      pass_filenames: false
      stages: [pre-push]
    - id: pip_audit
      name: Run pip-audit
      language: system
      entry: poetry poe pip_audit
      always_run: true
      pass_filenames: false
      stages: [pre-push]
